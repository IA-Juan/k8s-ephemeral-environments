apiVersion: apps/v1

kind: StatefulSet


metadata:

  name: {{ .Release.Name }}-postgres


spec:

  serviceName: {{ .Release.Name }}-postgres

  replicas: 1


  selector:

    matchLabels:

      app: {{ .Release.Name }}-postgres


  template:

    metadata:

      labels:

        app: {{ .Release.Name }}-postgres


    spec:

      containers:

      - name: postgres

        image: postgres:16


        ports:

        - containerPort: 5432


        envFrom:

        - secretRef:

            name: {{ .Release.Name }}-postgres-secret


        volumeMounts:

        - name: postgres-data

          mountPath: /var/lib/postgresql/data

        - name: postgres-init
          mountPath: /docker-entrypoint-initdb.d/schema.sql
          subPath: schema.sql


        - name: postgres-init
          mountPath: /docker-entrypoint-initdb.d/seed.sql
          subPath: seed.sql

volumeClaimTemplates:

  - metadata:

      name: postgres-data


    spec:

      accessModes:

      - ReadWriteOnce


      resources:

        requests:

          storage: 1Gi
